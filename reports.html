{% extends "base.html" %}
{% block content %}
<h1>Attendance Reports</h1>

<form class="search" method="get">
    <select name="student_id">
        <option value="">All Students</option>
        {% for s in students %}
        <option value="{{ s.student_id }}" {% if student_filter == s.student_id %}selected{% endif %}>
            {{ s.student_id }} - {{ s.name }}
        </option>
        {% endfor %}
    </select>

    <select name="subject_id">
        <option value="">All Subjects</option>
        {% for sub in subjects %}
        <option value="{{ sub.id }}" {% if subject_filter == sub.id|string %}selected{% endif %}>{{ sub.name }}</option>
        {% endfor %}
    </select>

    <button type="submit">Filter</button>
</form>

<table>
<thead><tr><th>Date</th><th>Student ID</th><th>Name</th><th>Class</th><th>Subject</th><th>Status</th></tr></thead>
<tbody>
{% for r in rows %}
<tr>
    <td>{{ r.attendance_date }}</td><td>{{ r.student_id }}</td><td>{{ r.name }}</td>
    <td>{{ r.class_name }}</td><td>{{ r.subject }}</td><td>{{ r.status }}</td>
</tr>
{% else %}
<tr><td colspan="6">No attendance records found.</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
